<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            font-size: 42px;
        }
    </style>
</head>
<body>
    <p>달식당 <span id="likeBtn">좋아요♡</span> <span id="likeCnt"></span></p>

    <script>
        let likeCnt = 0;
        const likeView = document.getElementById('likeCnt');
        const likeBtn = document.getElementById('likeBtn');

        likeView.innerText = likeCnt;
        
        likeBtn.addEventListener('click', ()=>{
            likeCnt++;
            likeView.innerText = likeCnt;
        });

    </script>
</body>
</html>
