<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form id="formId">
        <input type="text" id="loginId" placeholder="아이디"><br>
        <input type="password" id="loginPw" placeholder="비밀번호"><br>
        <button id="btnLogin">로그인 시도</button><br>
    </form>

    <script>
        const loginId = document.getElementById('loginId');
        const loginPw = document.getElementById('loginPw');
        const btnLogin = document.getElementById('btnLogin');
        const formId = document.getElementById('formId');

        loginId.focus();

        loginId.addEventListener('keydown', (e)=>{
            if(e.key === "Enter"){
                e.preventDefault();
                loginPw.focus();
            }
        });

        loginPw.addEventListener('keydown', (e)=>{
            if(e.key === "Enter"){
                e.preventDefault();
                btnLogin.click();
            }
        });

        formId.addEventListener('submit', (e)=>{
            e.preventDefault();
            const idInput = loginId.value.trim();
            const pwInput = loginPw.value.trim();
            
            if(idInput === ''){
                alert('id를 입력해주세요.');
                loginId.focus();
                return;
            }
            if(pwInput === ''){
                alert('pw를 입력해주세요.');
                loginPw.focus();
                return;
            }

            alert('submit 성공');
            formId.submit();
        });

    </script>
</body>

</html>
