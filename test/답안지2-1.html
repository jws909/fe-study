<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 400px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            background-color:darkslategrey;
        }

        .tab {
            display: flex;
        }

        .welcome-message {
            margin: 30px 0;
            font-size: 24px;
            color: white;
            text-align: center;
        }

        .input-area {
            display: flex;
            flex-direction: column;
        }

        .form-input {
            width: 100%;
            height: 30px;
            margin-bottom: 30px;
            padding: 0 10px;
            border: 1px solid #D5D5D5;
            background-color: transparent;
            color: white;
        }

        .btn {
            cursor: pointer;
        }
        
        .reg {
            width: 100%;
            height: 40px;
            background-color:grey;
            border: none;
            color: white;
        }

        .login {
            width: 100%;
            height: 40px;
            background-color:seagreen;
            border: none;
            color: white;
        }

        .submit {
            width: 100%;
            height: 40px;
            background-color:seagreen;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tab">
            <button class="btn reg" onclick="location.href='답안지2-2.html'">Sign Up</button>
            <button class="btn login" onclick="location.href='답안지2-1.html'">Log In</button>
        </div>
        <p class="welcome-message">Welcome Back!</p>
        <form class="input-area">
            <input class="form-input" type="email" placeholder="Email Address *">
            <input class="form-input" type="password" placeholder="Password *">
            <button class="btn submit">LOG IN</button>
        </form>
    </div>
</body>
</html>
